name: SET X alert
on:
  schedule:
    - cron: "0 10 * * *"   # 17:00 เวลาไทย (UTC+7) ทุกวัน
  workflow_dispatch:
    inputs:
      date:
        description: "ทดสอบแจ้งเตือนด้วยวันที่ YYYY-MM-DD (เว้นว่าง = วันนี้)"
        required: false
permissions:
  contents: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update events from SET
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 update_events.py

      - name: Commit updated events.json
        run: |
          if [ -n "$(git status --porcelain events.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add events.json
            git commit -m "Update events from SET"
            git push
          fi

      - name: Send alerts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DATE_INPUT: ${{ github.event.inputs.date }}
        run: python3 notify.py ${DATE_INPUT:+--date $DATE_INPUT}
